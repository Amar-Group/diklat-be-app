services:
  # ─────────────────────────────────────────────
  # Service: MySQL Database
  # ─────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: diklat-mysql
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-${MYSQL_PASSWORD:-root_secret_pass}}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-diklat_db}
      MYSQL_USER: ${MYSQL_USER:-diklat_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-diklat_password}
    volumes:
      - diklat_mysql_data:/var/lib/mysql
    networks:
      - diklat-global-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u $$MYSQL_USER -p$$MYSQL_PASSWORD || mysqladmin ping -h 127.0.0.1 --silent || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  # ─────────────────────────────────────────────
  # Service: Hono Backend Application
  # ─────────────────────────────────────────────
  backend:
    image: ghcr.io/amar-group/diklat-be-app:latest
    container_name: diklat-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Override DATABASE_URL to point to the 'db' service container
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE}
    ports:
      - "127.0.0.1:3090:3090"
    networks:
      - diklat-global-network
    depends_on:
      db:
        condition: service_healthy

# ─────────────────────────────────────────────
# Named Volumes
# ─────────────────────────────────────────────
volumes:
  diklat_mysql_data:
    driver: local

# ─────────────────────────────────────────────
# Networks — shared dengan diklat-fe-app
# ─────────────────────────────────────────────
networks:
  diklat-global-network:
    name: diklat-global-network
    external: true
