name: CI/CD — Deploy Backend (diklat-be-app)

on:
  push:
    branches:
      - main

env:
  # Registry & image settings
  REGISTRY: ghcr.io
  # Image name follows GHCR convention: ghcr.io/<owner>/<image>
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/diklat-be-app

jobs:
  # ──────────────────────────────────────────────────
  # JOB 1: Build & Push Docker Image to GHCR
  # ──────────────────────────────────────────────────
  build-and-push:
    name: 🏗️ Build & Push Image to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔐 Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Extract Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 🛠️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🚀 Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────────
  # JOB 2: Deploy to VPS via SSH
  # ──────────────────────────────────────────────────
  deploy-to-vps:
    name: 🚢 Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 📂 Copy docker-compose.yml to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: "docker-compose.yml"
          target: "/var/www/diklat-be"

      - name: 🔌 SSH into VPS and deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            # ── Navigasi ke direktori backend di VPS ──
            cd /var/www/diklat-be

            # ── Autentikasi ke GHCR menggunakan PAT ──
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # ── Pull image terbaru dari GHCR ──
            docker compose pull backend

            # ── Jalankan ulang service (zero-downtime style) ──
            docker compose up -d --remove-orphans

            # ── Jalankan migrasi database secara otomatis ──
            docker compose exec -T backend bun run db:migrate

            # ── Bersihkan image lama yang tidak terpakai ──
            docker image prune -f

            echo "✅ Backend deployment selesai."
